name: Build PiCrust Multi-Platform

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  macos:
    name: Build macOS (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test

      - name: Build macOS .app Bundle
        run: |
          chmod +x ./bundle-macos.sh ./scripts/release-notes.sh
          ./bundle-macos.sh

      - name: Upload macOS .app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiCrust-macOS
          path: dist-macos/*.zip

  windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test

      - name: Build Windows .exe & Package
        shell: pwsh
        run: .\bundle-windows.ps1

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PiCrust-Windows
          path: |
            dist-windows/PiCrust-windows-x64-*.exe
            dist-windows/PiCrust-windows-x64-*.zip

  linux:
    name: Build Linux (.AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            vulkan-tools \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            wget \
            file

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test

      - name: Build Linux Standalone AppImage
        run: |
          chmod +x ./bundle-linux.sh
          ./bundle-linux.sh

      - name: Upload Linux .AppImage
        uses: actions/upload-artifact@v4
        with:
          name: PiCrust-Linux
          path: dist-linux/*.AppImage

  release:
    name: Publish GitHub Release
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ -z "$version" ]]; then
            echo "Could not read version from Cargo.toml" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: PiCrust-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 Checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > "SHA256SUMS-${{ steps.version.outputs.version }}.txt"
          echo "Release assets:"
          ls -lh

      - name: Generate Complete Release Notes
        shell: bash
        env:
          ASSETS_DIR: release-assets
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x ./scripts/release-notes.sh
          ./scripts/release-notes.sh "$GITHUB_REF_NAME" release-assets > release-notes.md
          echo "Release notes length: $(wc -c < release-notes.md) bytes"

      - name: Publish Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          name: PiCrust v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*
