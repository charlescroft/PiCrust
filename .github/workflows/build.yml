name: Build PiCrust Multi-Platform

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  macos:
    name: Build macOS (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test

      - name: Build macOS .app Bundle
        run: |
          chmod +x ./bundle-macos.sh
          ./bundle-macos.sh
          cd dist-macos
          zip -r -y "PiCrust-macos.zip" "PiCrust.app"

      - name: Upload macOS .app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiCrust-macos-app
          path: dist-macos/PiCrust-macos.zip

  windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test

      - name: Build Windows .exe & Package
        shell: pwsh
        run: .\bundle-windows.ps1

      - name: Upload Windows Standalone .exe
        uses: actions/upload-artifact@v4
        with:
          name: PiCrust-windows-exe
          path: dist-windows/PiCrust.exe

      - name: Upload Windows Bundle ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PiCrust-windows-zip
          path: dist-windows/PiCrust-windows-x64.zip

  linux:
    name: Build Linux (.AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            vulkan-tools \
            libssl-dev \
            wget \
            file

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test

      - name: Build Linux Standalone AppImage
        run: |
          chmod +x ./bundle-linux.sh
          ./bundle-linux.sh

      - name: Upload Linux .AppImage
        uses: actions/upload-artifact@v4
        with:
          name: PiCrust-linux-appimage
          path: dist-linux/PiCrust-x86_64.AppImage

  release:
    name: Create GitHub Release
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: PiCrust-macos-app
          path: release-assets

      - name: Download Windows .exe
        uses: actions/download-artifact@v4
        with:
          name: PiCrust-windows-exe
          path: release-assets

      - name: Download Windows ZIP
        uses: actions/download-artifact@v4
        with:
          name: PiCrust-windows-zip
          path: release-assets

      - name: Download Linux .AppImage
        uses: actions/download-artifact@v4
        with:
          name: PiCrust-linux-appimage
          path: release-assets

      - name: Publish Release with Assets (.app, .exe, .AppImage)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/PiCrust-macos.zip
            release-assets/PiCrust.exe
            release-assets/PiCrust-windows-x64.zip
            release-assets/PiCrust-x86_64.AppImage
          draft: false
          prerelease: false
          generate_release_notes: true
