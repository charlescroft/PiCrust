name: Build PiCrust Multi-Platform

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  macos:
    name: Build macOS (Apple Silicon / Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pi-gpui

      - name: Run Test Suite
        run: |
          cd pi-gpui
          cargo test

      - name: Build and Package macOS .app Bundle
        run: |
          ./pi-gpui/bundle-macos.sh
          cd pi-gpui/dist-macos
          tar -czf PiCrust-macos-universal.tar.gz "PiCrust.app"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiCrust-macos
          path: pi-gpui/dist-macos/PiCrust-macos-universal.tar.gz

  windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pi-gpui

      - name: Run Tests
        run: |
          cd pi-gpui
          cargo test

      - name: Build Windows Binary
        run: |
          cd pi-gpui
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Windows Portable ZIP
        shell: pwsh
        run: |
          $OutputDir = "pi-gpui/dist-windows/PiCrust"
          New-Item -ItemType Directory -Path "$OutputDir/resources/sidecar" -Force | Out-Null
          Copy-Item "pi-gpui/target/x86_64-pc-windows-msvc/release/pi-gpui.exe" "$OutputDir/PiCrust.exe"
          if (Test-Path "pi-gpui/dist-sidecar/server.mjs") {
            Copy-Item "pi-gpui/dist-sidecar/server.mjs" "$OutputDir/resources/sidecar/"
          }
          if (Test-Path "pi-gpui/sidecar/api-sidecar.mjs") {
            Copy-Item "pi-gpui/sidecar/api-sidecar.mjs" "$OutputDir/resources/sidecar/"
            Copy-Item "pi-gpui/sidecar/router-utils.mjs" "$OutputDir/resources/sidecar/"
          }
          Compress-Archive -Path "$OutputDir/*" -DestinationPath "pi-gpui/dist-windows/PiCrust-windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiCrust-windows-x64
          path: pi-gpui/dist-windows/PiCrust-windows-x64.zip

  linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            vulkan-tools \
            libssl-dev

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pi-gpui

      - name: Run Tests
        run: |
          cd pi-gpui
          cargo test

      - name: Build Linux Binary
        run: |
          cd pi-gpui
          cargo build --release

      - name: Package Linux Binary Archive
        run: |
          mkdir -p pi-gpui/dist-linux/PiCrust/resources/sidecar
          cp pi-gpui/target/release/pi-gpui pi-gpui/dist-linux/PiCrust/picrust
          chmod +x pi-gpui/dist-linux/PiCrust/picrust
          if [ -f "pi-gpui/dist-sidecar/server.mjs" ]; then
            cp pi-gpui/dist-sidecar/server.mjs pi-gpui/dist-linux/PiCrust/resources/sidecar/
          fi
          if [ -f "pi-gpui/sidecar/api-sidecar.mjs" ]; then
            cp pi-gpui/sidecar/api-sidecar.mjs pi-gpui/dist-linux/PiCrust/resources/sidecar/
            cp pi-gpui/sidecar/router-utils.mjs pi-gpui/dist-linux/PiCrust/resources/sidecar/
          fi
          cd pi-gpui/dist-linux
          tar -czf PiCrust-linux-x86_64.tar.gz PiCrust/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PiCrust-linux-x86_64
          path: pi-gpui/dist-linux/PiCrust-linux-x86_64.tar.gz
