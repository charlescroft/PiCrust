[package]
name = "pi-gpui"
version = "1.0.0"
edition = "2024"
description = "Native GPUI Kit desktop client for Pi Agent"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
chrono = "0.4"
eventsource-stream = "0.2"
futures = "0.3"
gpui-kit = { version = "0.9.1", features = ["gpui-fast", "syntect"] }
gpui-kit-markdown-extras = { version = "0.3.0", features = [
    "math",
    "mermaid-flowchart",
    "mermaid-sequence",
    "mermaid-class",
    "mermaid-state",
    "mermaid-gantt",
] }
gpui-webview = { version = "0.9.1", features = ["gpui-fast"] }
gpui_xterm = "0.3.0"
ignore = "0.4"
nucleo-matcher = "0.3"
open = "5"
parking_lot = "0.12"
portable-pty = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "io-util", "sync"] }
trash = "5"
uuid = { version = "1", features = ["v4"] }
wry = { version = "0.53.3", package = "lb-wry" }

[patch.crates-io]
gpui-component = { path = "patches/gpui-component" }
gpui-fast-macos = { path = "patches/gpui-fast-macos" }
gpui-pre-macos = { path = "patches/gpui-pre-macos" }
gpui_xterm = { path = "patches/gpui_xterm" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
